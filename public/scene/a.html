<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151322">
  <title>osakamadagascar — Late Night Sign-Off</title>
  <link rel="stylesheet" href="/scene/scene.css">
</head>
<body class="scene-a">
  <main class="full-scene">
    <svg class="scene-art" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="a-sky" x2="0" y2="1"><stop stop-color="#171626"/><stop offset=".55" stop-color="#292039"/><stop offset="1" stop-color="#4a2c35"/></linearGradient>
        <radialGradient id="a-glow"><stop stop-color="#e99d58" stop-opacity=".34"/><stop offset="1" stop-color="#e99d58" stop-opacity="0"/></radialGradient>
        <linearGradient id="a-window" x2="0" y2="1"><stop stop-color="#282744"/><stop offset="1" stop-color="#693b47"/></linearGradient>
        <linearGradient id="a-floor" x2="0" y2="1"><stop stop-color="#4c2d39"/><stop offset="1" stop-color="#211b2b"/></linearGradient>
      </defs>
      <rect width="1920" height="1080" fill="url(#a-sky)"/>
      <ellipse cx="970" cy="550" rx="800" ry="570" fill="url(#a-glow)"/>
      <g fill="#ffe5b4" opacity=".74">
        <circle class="twinkle t1" cx="184" cy="180" r="2"/><circle class="twinkle t2" cx="430" cy="112" r="2.5"/>
        <circle class="twinkle t3" cx="1210" cy="120" r="2"/><circle class="twinkle t1" cx="1380" cy="250" r="1.7"/>
        <circle class="twinkle t2" cx="1110" cy="280" r="1.5"/><circle class="twinkle t3" cx="330" cy="720" r="1.6"/>
        <circle class="twinkle t1" cx="1275" cy="820" r="2"/>
      </g>
      <path d="M0 790 Q280 710 550 810 T1080 785 T1570 800 T1920 735 V1080 H0Z" fill="url(#a-floor)"/>
      <g opacity=".9">
        <rect x="1490" y="0" width="430" height="710" rx="10" fill="#261c2b"/>
        <rect x="1520" y="0" width="370" height="625" fill="url(#a-window)"/>
        <path d="M1520 355H1890M1705 0V625" stroke="#bd795d" stroke-width="17" opacity=".54"/>
        <path d="M1510 0Q1570 160 1540 625L1495 710V0ZM1900 0Q1840 170 1870 630L1915 700V0Z" fill="#5a3442"/>
      </g>
      <g fill="#d78654" opacity=".5">
        <path d="M130 970q20-108 74-147q-4 70-52 105q67-72 142-69q-48 66-124 74q75-22 125 20q-94 2-166 39z"/>
        <path d="M1365 1020q12-100 55-140q-8 65-42 95q56-64 117-66q-38 56-101 69q61-17 101 21q-74 0-130 31z"/>
      </g>
      <ellipse cx="720" cy="1050" rx="700" ry="48" fill="#130f1c" opacity=".42"/>
    </svg>

    <header class="scene-brand brand-a">
      <span class="brand-mark">✦</span>
      <span>osakamadagascar</span>
      <span class="brand-divider"></span>
      <span class="brand-mode">LATE NIGHT</span>
    </header>

    <section class="signoff-copy" aria-label="Stream sign-off">
      <span class="copy-kicker"><span class="live-dot"></span> THAT'S A WRAP</span>
      <h1>Thanks for<br>watching!</h1>
      <p>Raiding a friend next.</p>
      <span class="copy-rule"></span>
      <span class="copy-small">Stay cozy. See you soon.</span>
    </section>

    <section class="camera-placeholder" aria-label="Webcam frame placeholder">
      <div class="camera-topline"><span>CAMERA 01</span><span class="camera-spark">✦</span></div>
      <div class="camera-inner">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="36" r="16"/><path d="M17 91c3-23 15-35 33-35s30 12 33 35"/></svg>
        <strong>WEBCAM FRAME</strong>
        <span>place your camera source here</span>
      </div>
    </section>

    <div class="scene-caption caption-a">SLOW DOWN · STAY AWHILE</div>
    <div class="scene-orb orb-a" aria-hidden="true"></div>
  </main>
</body>
</html>
