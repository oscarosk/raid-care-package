<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raid Care Package — Unbox</title>
  <link rel="stylesheet" href="/overlay/overlay.css">
</head>
<body class="unbox-page">
  <main class="unbox-stage" aria-live="polite">
    <div class="unbox-heading" id="unbox-heading">
      <div class="eyebrow"><span class="eyebrow-dot"></span> A PACKAGE FROM CHAT</div>
      <h1 id="unbox-title">Something's on the way</h1>
      <p id="unbox-subtitle">Good things travel together.</p>
    </div>
    <div class="unbox-scene">
      <div class="gift-box" id="unbox-box" aria-hidden="true">
        <div class="gift-lid"></div><div class="gift-front"></div><div class="gift-ribbon"></div>
        <span class="gift-spark">✦</span>
      </div>
      <div class="reveal-list" id="reveal-list"></div>
    </div>
    <div class="welcome-card" id="welcome-card" hidden>
      <span class="welcome-star">✦</span>
      <span class="welcome-kicker">THE DOOR IS OPEN</span>
      <strong id="welcome-title">Welcome, friends!</strong>
      <span id="welcome-detail"></span>
    </div>
  </main>
  <script src="/overlay/unbox.js" defer></script>
</body>
</html>
